

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: padel_sql_server
    ports:
      - "1445:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=NouveauMotDePasse123!
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data: